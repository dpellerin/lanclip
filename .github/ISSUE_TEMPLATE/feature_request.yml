name: Feature request
description: Suggest a scoped improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Lanclip solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy and security impact
      description: Explain any effect on data exposure, trust, network scope, storage, or logging.
    validations:
      required: true
