name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build
      - name: Scan source for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Scan built binary for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary ./bin/lanclip
      - name: Check installer syntax
        run: bash -n install/linux/*.sh install/macos/*.sh
      - name: Validate LaunchAgent
        if: runner.os == 'macOS'
        run: plutil -lint install/macos/com.dpellerin.lanclip.plist
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install/linux/*.sh install/macos/*.sh
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all --exit-code=1
