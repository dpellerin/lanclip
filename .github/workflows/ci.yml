name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build
      - name: Check installer syntax
        run: bash -n install/linux/*.sh install/macos/*.sh
      - name: Validate LaunchAgent
        if: runner.os == 'macOS'
        run: plutil -lint install/macos/com.dpellerin.lanclip.plist
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install/linux/*.sh install/macos/*.sh
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all --exit-code=1
